<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grandezas proporcionais | Ação SARESP</title>
<style>
:root{color-scheme:dark;--bg:#071326;--panel:#101e34;--line:#334563;--white:#f1f6ff;--muted:#b9c8df;--cyan:#51e3e0;--green:#6befa2;--yellow:#ffd45c;--red:#ff8683}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--white);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.35}
button{font:inherit;color:inherit;background:#152742;border:1px solid var(--line);border-radius:.65rem;padding:.6rem .95rem;cursor:pointer}
button:hover:not(:disabled){border-color:var(--cyan)}button:focus-visible,a:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}button:disabled{opacity:.45;cursor:default}
a{color:var(--cyan)}[hidden]{display:none!important}
.app{max-width:1920px;margin:auto;padding:clamp(9px,1.8vh,20px) clamp(10px,2.6vw,48px);min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto;gap:clamp(9px,1.55vh,18px)}
.brand{color:var(--cyan);font-weight:800;letter-spacing:.13em;font-size:clamp(.74rem,1.5vw,1.04rem)}
.top,.controls,.question-head,.clock-head{display:flex;align-items:center;justify-content:space-between;gap:.8rem}
h1,h2,p{margin:0}
h1{font-size:clamp(2rem,min(5vw,7vh),4.9rem);line-height:1.06;letter-spacing:-.038em}
.intro{min-height:100%;display:grid;align-content:center;gap:1.45rem;max-width:880px}.intro h1 strong{color:var(--cyan)}
.intro p,.intro li{font-size:clamp(1rem,2.3vw,1.6rem);color:var(--muted)}.intro ul{margin:0;padding-left:1.3em}.intro li+li{margin-top:.55rem}
.kicker{font-size:clamp(.8rem,1.55vw,1rem);letter-spacing:.11em;color:var(--muted);font-weight:750;text-transform:uppercase}
.question{display:grid;gap:clamp(.38rem,1vh,.8rem);align-content:start;justify-items:center}
.question > *{width:100%;max-width:100rem}
.solution{background:#102a29;border-left:4px solid var(--green);border-radius:.35em;padding:.55em .85em;font-size:clamp(.95rem,min(2vw,3vh),1.42rem)}.solution p+p{margin-top:.35em}
.clock-box{max-width:100rem;display:grid;gap:.35rem}
.clock-head{justify-content:flex-start;flex-wrap:wrap;font-size:clamp(.78rem,1.4vw,.97rem);color:var(--muted)}
.clock{font-size:clamp(1.5rem,min(4vw,5vh),3rem);font-weight:850;font-variant-numeric:tabular-nums;color:var(--accent);line-height:1}
.clock-box progress{height:5px;width:100%;border:0;border-radius:6px;background:#25324b;appearance:none}
progress::-webkit-progress-bar{background:#25324b;border-radius:6px}progress::-webkit-progress-value{background:var(--accent);border-radius:6px}progress::-moz-progress-bar{background:var(--accent)}
.controls{border-top:1px solid var(--line);padding-top:.75rem;flex-wrap:wrap;color:var(--muted)}
.controls .group{display:flex;flex-wrap:wrap;gap:.45rem}.controls button{font-size:.93rem}.primary{color:#061826;background:var(--cyan);border-color:var(--cyan);font-weight:800}
.tip{font-size:clamp(.81rem,1.4vw,.97rem);color:var(--muted)}.resource{margin-top:.75rem;padding-left:1.15rem}
.review-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.45rem;max-width:40rem}
.review-grid button{text-align:left}
@media(max-width:560px){.app{gap:13px}.controls .group{gap:.3rem}.controls button{padding:.47rem .55rem}.review-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media print{body{color:#111;background:white}.controls{display:none}}
.slide-surface{position:relative;min-width:0;display:grid}
.ink-layer{position:absolute;inset:0;z-index:1;width:100%;height:100%;overflow:hidden;pointer-events:none}
.ink-layer.is-drawing{pointer-events:auto;cursor:crosshair;touch-action:none;user-select:none}
.ink-layer path{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
#pen[aria-pressed="true"]{background:var(--cyan);border-color:var(--cyan);color:#071f1d;font-weight:800}
.pen-tools{display:flex;flex-wrap:wrap;gap:.38rem;align-items:center}
.pen-width{display:inline-flex;align-items:center;gap:.35rem;font-size:.88rem;color:var(--muted)}
.pen-width select{color:var(--white)}

#open-board{color:var(--cyan);border-color:var(--cyan);font-weight:800}
.board-dialog{
  box-sizing:border-box;width:min(96vw,1440px);height:94vh;height:94dvh;
  max-width:none;max-height:none;padding:clamp(.65rem,2vw,1.35rem);
  color:var(--white);background:#12102a;border:1px solid #7463aa;border-radius:1rem
}
.board-dialog[open]{display:grid;grid-template-rows:auto minmax(0,1fr);gap:.75rem}
.board-dialog::backdrop{background:#050314dc}
.board-header{display:flex;justify-content:space-between;align-items:center;gap:.55rem 1rem;flex-wrap:wrap}
.board-heading{display:grid;gap:.15rem}
.board-heading h2{color:var(--cyan)}
#board-topic{color:var(--muted);font-size:.95rem}
.board-surface{
  position:relative;min-width:0;min-height:0;overflow:hidden;border:1px solid #4a426f;border-radius:.6rem;
  background-color:#0b0920;
  background-image:linear-gradient(to right,#39315c70 1px,transparent 1px),linear-gradient(to bottom,#39315c70 1px,transparent 1px);
  background-size:28px 28px
}
#close-board{background:var(--cyan);border-color:var(--cyan);color:#071f1d;font-weight:800}

:root{--bg:#09071c;--panel:#171130;--line:#57487c;--white:#fbf8ff;--muted:#ccc3e6;--cyan:#4ef9ff;--green:#c8ff5e;--yellow:#ffe76b;--red:#ff69e0}
body{background:radial-gradient(ellipse at 95% 0,#32144e 0,transparent 54%),radial-gradient(ellipse at 0 100%,#102747,transparent 50%),var(--bg)}
.top{flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:.5rem}
.top-tools{display:flex;align-items:center;gap:.45rem;flex-wrap:wrap}
select{background:var(--panel);color:var(--white);border:1px solid var(--line);border-radius:.55rem;padding:.45rem;font:inherit;max-width:100%}
select:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
.slide-surface{grid-template-columns:minmax(0,1fr)}
#stage{min-width:0}
.intro{max-width:none;align-content:start;padding-top:clamp(.4rem,2.5vh,1.5rem)}
.cover-grid,.question-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(.75rem,3vw,2.5rem);align-items:start}
.cover-copy,.copy,.model-example{display:grid;gap:clamp(.6rem,1.5vh,1rem)}
.cover-art{display:block;width:100%;max-height:57vh;object-fit:contain;background:#09071c;border:1px solid var(--line);border-radius:.85rem}
.question h1{font-size:clamp(1.55rem,min(4vw,5.6vh),4rem);margin:.35em 0 .14em}
.prompt{font-size:clamp(1.05rem,min(2.2vw,3.35vh),1.85rem)}
.options{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.45rem}
.options li{font-size:clamp(1rem,min(1.7vw,2.75vh),1.45rem);padding:.48em .55em;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:.55rem;display:flex;gap:.45em}
.options b{color:var(--accent)}
.options .correct{background:#223629;border-color:var(--green)}
.figure{margin:0;display:grid;gap:.55rem;padding:clamp(.65rem,2vw,1.2rem);background:radial-gradient(ellipse at top right,#35194b,#10112c);border:1px solid #705da3;border-radius:.85rem}
.figure table{border-collapse:separate;border-spacing:0 .35rem;width:100%;font-size:clamp(.9rem,2vw,1.4rem);text-align:left}
.figure th,.figure td{padding:.38em .48em}
.figure th{font-size:.9em;color:var(--muted)}
.figure td{background:#0c0c26;font-weight:750;color:var(--cyan);border-bottom:1px solid #423961}
.scene-icons{display:flex;flex-wrap:wrap;gap:.12rem;margin-bottom:.25rem;color:var(--red)}
.figure td:last-child{color:var(--green)}
.figure td.unknown{color:var(--red)}
.figure figcaption,.eyebrow{color:var(--muted);font-size:.93rem}
.model-example{--accent:var(--cyan);padding-top:clamp(.4rem,2.5vh,1.5rem)}
.model-example strong{color:var(--cyan)}
.clock-head .kicker{color:var(--accent)}
#board-clock{--accent:var(--cyan)}
@media(max-width:700px){.cover-grid,.question-grid{grid-template-columns:1fr}.question-grid .copy{display:contents}.question-grid .figure{grid-row:2}.cover-art{max-height:33vh}}
@media(max-width:350px){.options{grid-template-columns:1fr}}

/* A scene belongs to the slide; handwritten annotations stay above it. */
.scene-stage{
  min-height:clamp(22rem,66vh,43rem);
  padding:clamp(.75rem,2vw,1.6rem);
  border:1px solid #655488;
  border-radius:.9rem;
  background-color:#100b24;
  background-image:linear-gradient(90deg,#100b24 1%,#100b24ec 33%,#100b2490 65%,#100b2442),var(--scene-art);
  background-repeat:no-repeat;
  background-position:center,right center;
  background-size:100% 100%,auto 112%;
}
.scene-stage>.model-example{padding-top:0}
.scene-stage .figure{
  background:linear-gradient(135deg,#211639e8,#10112ce8);
}
.scene-stage .solution{background:#102a29f5}
.scene-stage .prompt,.scene-stage h1{
  text-shadow:0 2px 7px #090616,0 1px 3px #090616;
}
@media(max-width:700px){
  .scene-stage{
    position:relative;
    isolation:isolate;
    padding-top:clamp(7.8rem,31vw,14rem);
    background-image:none;
  }
  .scene-stage::before{
    content:"";
    position:absolute;
    z-index:-1;
    inset:0 0 auto;
    height:clamp(9rem,43vw,19rem);
    border-radius:.9rem .9rem 0 0;
    background:linear-gradient(180deg,#100b2410 0%,#100b2430 35%,#100b24 100%),var(--scene-art) center/cover;
    pointer-events:none;
  }
}
@media print{
  .scene-stage{background-image:none;color:#111;min-height:0;padding-top:.5rem}
  .scene-stage::before{display:none}
  .scene-stage .prompt,.scene-stage h1{text-shadow:none}
}

function stop() {
  clearInterval(interval);
  interval = null;
  el('toggle').textContent = remaining <= 0 ? 'Iniciar tempo' : 'Continuar tempo';
}
function drawTimer() {
  el('clock').textContent = format(Math.ceil(remaining/1000));
  el('board-clock').textContent = el('clock').textContent;
  el('progress').value = remaining/1000;
  el('time-up').hidden = remaining > 0;
}
function resetClock() {
  remaining = level().time * 1000;
  stop();
  el('toggle').textContent = 'Iniciar tempo';
  drawTimer();
}
function tick() {
  remaining = Math.max(0, deadline - performance.now());
  drawTimer();
  if (!remaining) stop();
}
function toggleClock() {
  if (!active() || el('reveal').getAttribute('aria-pressed') === 'true') return;
  if (interval !== null) { tick(); stop(); return; }
  if (remaining === 0) resetClock();
  deadline = performance.now() + remaining;
  el('toggle').textContent = 'Pausar tempo';
  interval = setInterval(tick, 100);
}
function showCorrection() {
  if (!active()) return;

const inkNamespace='http://www.w3.org/2000/svg';
// Keep x proportional to the writing surface, and y in CSS pixels so a slide
// growing when the correction opens does not stretch the annotations.
const inkWidth=1000;
function setupInk({ink,strokes,color,thickness,undo,clear}){
  const inkBySlide=new Map();
  let inkPage;
  let drawing=ink.classList.contains('is-drawing');
  let activeStroke=null;

  function syncInkViewport(){
    const {height}=ink.getBoundingClientRect();
    if(height>0)ink.setAttribute('viewBox','0 0 '+inkWidth+' '+height);
  }

  function updateInkButtons(){
    const hasInk=!!inkPage.group.lastElementChild;
    undo.disabled=!hasInk&&!inkPage.cleared.length;
    clear.disabled=!hasInk;
  }

  function endStroke(){
    if(!activeStroke)return;
    const {id}=activeStroke;
    activeStroke=null;
    if(ink.hasPointerCapture(id))ink.releasePointerCapture(id);
  }

  function show(slide){
    endStroke();
    if(!inkBySlide.has(slide)){
      inkBySlide.set(slide,{group:document.createElementNS(inkNamespace,'g'),cleared:[]});
    }
    inkPage=inkBySlide.get(slide);
    strokes.replaceChildren(inkPage.group);
    syncInkViewport();
    updateInkButtons();
  }

  function setDrawing(enabled){
    endStroke();
    drawing=enabled;
    ink.classList.toggle('is-drawing',enabled);
  }

  function inkPoint(event,bounds){
    const x=(event.clientX-bounds.left)*inkWidth/bounds.width;
    const y=event.clientY-bounds.top;
    return [x.toFixed(2),y.toFixed(2)];
  }

  ink.addEventListener('pointerdown',event=>{
    if(!drawing||!inkPage||activeStroke||!event.isPrimary||event.button!==0)return;
    const bounds=ink.getBoundingClientRect();
    if(!bounds.width||!bounds.height)return;
    event.preventDefault();
    syncInkViewport();
    ink.setPointerCapture(event.pointerId);
    const point=inkPoint(event,bounds);
    const path=document.createElementNS(inkNamespace,'path');
    path.setAttribute('stroke',color.value);
    path.setAttribute('stroke-width',thickness.value);
    const data='M '+point.join(' ')+' l .01 0';
    path.setAttribute('d',data);
    inkPage.group.append(path);
    activeStroke={id:event.pointerId,path,data,last:point.join(' ')};
    updateInkButtons();
  });

  function extendStroke(event){
    if(activeStroke?.id!==event.pointerId)return;
    const bounds=ink.getBoundingClientRect();
    if(!bounds.width)return;
    const samples=event.getCoalescedEvents?.()??[];
    for(const sample of samples.length?samples:[event]){
      const point=inkPoint(sample,bounds).join(' ');
      if(activeStroke.last===point)continue;
      activeStroke.data+=' L '+point;
      activeStroke.last=point;
    }
    activeStroke.path.setAttribute('d',activeStroke.data);
  }
  ink.addEventListener('pointermove',extendStroke);
  ink.addEventListener('pointerup',event=>{
    if(activeStroke?.id!==event.pointerId)return;
    extendStroke(event);
    endStroke();
  });
  for(const type of ['pointercancel','lostpointercapture']){
    ink.addEventListener(type,event=>{
      if(activeStroke?.id===event.pointerId)endStroke();
    });
  }
  undo.onclick=()=>{
    endStroke();
    const group=inkPage.group;
    if(group.lastElementChild){
      group.lastElementChild.remove();
    }else if(inkPage.cleared.length){
      for(const stroke of inkPage.cleared.pop())group.append(stroke);
    }
    updateInkButtons();
  };
  clear.onclick=()=>{
    endStroke();
    const group=inkPage.group;
    if(group.childElementCount){
      inkPage.cleared.push(Array.from(group.children));
      group.replaceChildren();
    }
    updateInkButtons();
  };
  if(typeof ResizeObserver==='function')new ResizeObserver(syncInkViewport).observe(ink);
  else window.addEventListener('resize',syncInkViewport);
  return {show,setDrawing,endStroke};
}

  } else if (!active()) {
    el('stage').innerHTML = `<section class="intro"><h1>Qual questão vale revisar?</h1><p>Escreva o número no chat e explique em que passo surgiu a dúvida.</p><div class="review-grid" aria-label="Voltar para uma questão">${questions.map((_, i) => `<button type="button" data-review="${i}">Questão ${i+1}</button>`).join('')}</div></section>`;
  } else {
    const q = questions[index], l = level();
    el('stage').innerHTML = `<section class="question" id="current-question" style="--accent:${l.color}">
      <div class="clock-box"><div class="clock-head">
        <span class="kicker">Rodada ${Math.floor(index/3)+1} · ${l.label}</span>
        <span id="clock" class="clock" role="timer" aria-label="Tempo restante"></span>
        <span id="time-up" aria-live="polite" hidden>Tempo encerrado.</span>
      </div><progress id="progress" max="${l.time}" aria-label="Tempo restante"></progress></div>
      <h1>${q.title}</h1>
      <div class="question-grid"><div class="copy"><p class="prompt">${q.prompt}</p>
      <ol id="options" class="options" aria-label="Alternativas">${q.options.map((option,i)=>`<li><b>${letters[i]})</b><span>${option}</span></li>`).join('')}</ol></div>
      ${visual(q.visual,index)}</div>
      <div class="solution" id="solution" aria-live="polite" hidden></div>
    </section>`;
    const answer = document.createElement('strong');
    answer.textContent = `Resposta ${letters[q.answer]} · ${q.result}. `;
    el('solution').replaceChildren(answer, q.solution);
    el('reveal').setAttribute('aria-pressed','false');
    el('reveal').textContent = 'Mostrar correção';
    el('toggle').disabled = false;
    el('reset').disabled = false;
    resetClock();
  }
  slideInk.show(index);
}

el('prev').onclick = () => go(index-1);
el('next').onclick = () => go(index+1);
el('toggle').onclick = toggleClock;
el('reset').onclick = resetClock;
el('reveal').onclick = showCorrection;
el('stage').addEventListener('click', event => {
  const review = event.target.closest('[data-review]');
  if (review) go(Number(review.dataset.review));
});
el('fullscreen').hidden = !document.fullscreenEnabled;
el('fullscreen').onclick = async () => {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();
  } catch { el('fullscreen').textContent = 'Tela cheia indisponível'; }
};
document.addEventListener('fullscreenchange', () => {
  el('fullscreen').textContent = document.fullscreenElement ? 'Sair da tela cheia' : 'Tela cheia';
});
document.addEventListener('keydown', event => {
  if (board.open || event.target.closest('select') || event.ctrlKey || event.altKey || event.metaKey || event.defaultPrevented) return;
  if (event.key === 'ArrowLeft') go(index-1);
  if (event.key === 'ArrowRight') go(index+1);
});
go(-3);
</script>
</body>
</html>
